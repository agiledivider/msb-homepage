# Production stack: the app plus a persistent SQLite DB and media on named volumes.
#
#   1) build & push:   docker build -t <registry>/msb-homepage:TAG .
#                      docker push <registry>/msb-homepage:TAG
#   2) on the server:  put IMAGE + secrets in a `.env` next to this file, then
#                      docker compose -f docker-compose.prod.yml up -d
#
# First start on a fresh `db` volume: open /admin and create the first user.

services:
  web:
    image: ${IMAGE:-msb-homepage:latest}
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      # SQLite file lives on the `db` volume
      DATABASE_URI: file:/app/data/msb.db
      # uploaded media lives on the `media` volume
      MEDIA_DIR: /app/public/media
      # required — generate with: openssl rand -hex 32
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?set PAYLOAD_SECRET in .env}
      # required — public URL of this deployment (used by live preview)
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:?set NEXT_PUBLIC_SERVER_URL in .env}
      # optional: on a fresh DB, seed a ready-to-use admin (roles + permissions are
      # always seeded). Leave unset to create the first user via /admin instead.
      INIT_ADMIN_EMAIL: ${INIT_ADMIN_EMAIL:-}
      INIT_ADMIN_PASSWORD: ${INIT_ADMIN_PASSWORD:-}
      # Kanidm SSO (OIDC) — optional; all three enable the "Sign in with Kanidm"
      # button. Password login stays available. See src/plugins/oidc.
      KANIDM_ISSUER: ${KANIDM_ISSUER:-}
      KANIDM_CLIENT_ID: ${KANIDM_CLIENT_ID:-}
      KANIDM_CLIENT_SECRET: ${KANIDM_CLIENT_SECRET:-}
      KANIDM_ROLES_CLAIM: ${KANIDM_ROLES_CLAIM:-}
    volumes:
      - db:/app/data
      - media:/app/public/media

  # Nightly off-server backup of the db + media volumes (restic). Operations
  # (restore, choosing a target): DEPLOY.md "Backups".
  backup:
    image: ${BACKUP_IMAGE:-ghcr.io/agiledivider/msb-backup:latest}
    restart: unless-stopped
    environment:
      # required — where backups go (any restic backend) and its encryption
      # password. Lose the password and the backups are unreadable.
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:?set RESTIC_REPOSITORY in .env}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:?set RESTIC_PASSWORD in .env}
      # backend credentials, as the chosen backend needs them
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      B2_ACCOUNT_ID: ${B2_ACCOUNT_ID:-}
      B2_ACCOUNT_KEY: ${B2_ACCOUNT_KEY:-}
      BACKUP_AT: ${BACKUP_AT:-03:30}
      BACKUP_PING_URL: ${BACKUP_PING_URL:-}
    volumes:
      - db:/volumes/db
      - media:/volumes/media

volumes:
  db:
  media:
