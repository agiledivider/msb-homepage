# The whole system: CMS + publisher + the published website.
#
# Two ways to run it — same file, both modes, because each service carries both a
# `build:` section and a ghcr `image:` tag:
#
#   Local (build from source):
#     cp .env.local.example .env      # fill in PAYLOAD_SECRET + PUBLISH_TOKEN
#     docker compose up -d --build
#
#   Server / new instance (pull the images CI pushed to ghcr — no source needed):
#     docker compose pull            # fetches ghcr.io/agiledivider/msb-homepage + msb-publisher
#     docker compose up -d
#     # `docker login ghcr.io` first if the packages are private (or set
#     #  GHCR_USER/GHCR_TOKEN and `echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin`)
#
#   admin    → http://localhost:3000/admin   (or your NEXT_PUBLIC_SERVER_URL)
#   website  → http://localhost:8080         (after the first publish)
#
# `payload` and `publisher` are the authoring stack; `web` stands in for the
# public host. In production the website is a separate deployment that pulls the
# pushed image (docker-compose.demo.yml) — here it serves the same snapshot from
# a shared volume so the full loop can be exercised without a registry.
#
# PUSH_IMAGE defaults to false below: a local test must not be able to overwrite
# the production tag. Set it true (with GHCR_USER/GHCR_TOKEN) to also push.

services:
  payload:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: ghcr.io/agiledivider/msb-homepage:latest
    restart: unless-stopped
    # Ceiling so a runaway can't take the whole box. `next start` + Payload sits
    # around 0.4–0.7 GB; 1 GB leaves headroom. Override per host if needed.
    mem_limit: ${PAYLOAD_MEM_LIMIT:-1g}
    ports:
      - '${PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      TZ: Europe/Berlin
      DATABASE_URI: file:/app/data/msb.db
      MEDIA_DIR: /app/public/media
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?set PAYLOAD_SECRET in .env}
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-http://localhost:3000}
      # The admin's publish button posts here. Internal network only.
      PUBLISHER_URL: http://publisher:8080
      PUBLISH_TOKEN: ${PUBLISH_TOKEN:?set PUBLISH_TOKEN in .env}
      INIT_ADMIN_EMAIL: ${INIT_ADMIN_EMAIL:-}
      INIT_ADMIN_PASSWORD: ${INIT_ADMIN_PASSWORD:-}
      # Kanidm SSO (OIDC) — optional; all three enable the "Sign in with Kanidm"
      # button. Password login stays available. See src/plugins/oidc.
      KANIDM_ISSUER: ${KANIDM_ISSUER:-}
      KANIDM_CLIENT_ID: ${KANIDM_CLIENT_ID:-}
      KANIDM_CLIENT_SECRET: ${KANIDM_CLIENT_SECRET:-}
      KANIDM_ROLES_CLAIM: ${KANIDM_ROLES_CLAIM:-}
    volumes:
      - db:/app/data
      - media:/app/public/media

  publisher:
    build:
      context: .
      dockerfile: Dockerfile.publisher
    image: ghcr.io/agiledivider/msb-publisher:latest
    restart: unless-stopped
    # The on-demand `next build` is the memory-hungry step (~1.5–2.5 GB peak).
    # This cap must sit ABOVE that peak, or the build worker gets OOM-killed
    # ("exited with code: 1"). If host swap exists, the container may spill into
    # it up to the same amount again (memswap defaults to 2× mem_limit). On a
    # tight box, raise this or cap the build workers instead.
    mem_limit: ${PUBLISHER_MEM_LIMIT:-2560m}
    # No `ports:` — only payload may reach it, and only after checking the
    # caller's role.
    environment:
      NODE_ENV: production
      TZ: Europe/Berlin
      PUBLISH_TOKEN: ${PUBLISH_TOKEN:?set PUBLISH_TOKEN in .env}
      # The publisher runs the full Next app to crawl it, so it initialises
      # Payload too — without the secret every route renders an error page and
      # the snapshot comes out empty.
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?set PAYLOAD_SECRET in .env}
      SOURCE_DATABASE_FILE: /data/msb.db
      MEDIA_DIR: /app/public/media
      # Compiled into the bundle: the PUBLIC origin of the site, not this stack.
      NEXT_PUBLIC_SERVER_URL: ${PUBLIC_SITE_URL:-http://localhost:8080}
      # Hand the snapshot to the local `web` container.
      SITE_HTML_DIR: /site/html
      SITE_CONF_DIR: /site/conf
      # Off by default so a local run can never overwrite the production tag.
      PUSH_IMAGE: ${PUSH_IMAGE:-false}
      STATIC_IMAGE: ${STATIC_IMAGE:-ghcr.io/agiledivider/msb-demo}
      TAG: ${TAG:-latest}
      PLATFORM: ${PLATFORM:-linux/amd64}
      PUBLISH_NIGHTLY_HOUR: ${PUBLISH_NIGHTLY_HOUR:-3}
      PUBLISH_DEBOUNCE_MS: ${PUBLISH_DEBOUNCE_MS:-300000}
      GIT_SHA: ${GIT_SHA:-nogit}
      # Registry credentials. A mounted ~/.docker is not usable on Docker
      # Desktop (credsStore keeps the token in the OS keychain), so pass a
      # token explicitly. Only needed when PUSH_IMAGE=true.
      GHCR_USER: ${GHCR_USER:-}
      GHCR_TOKEN: ${GHCR_TOKEN:-}
    volumes:
      # The CMS state, read-only — the DB is copied before each build anyway.
      - db:/data:ro
      - media:/app/public/media:ro
      - site_html:/site/html
      - site_conf:/site/conf
      # Keeps "last published" + the ETA baseline across container updates.
      - publisher_state:/state
      # Registry credentials, only needed when PUSH_IMAGE=true.
    depends_on:
      - payload

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    # nginx serving static files barely uses anything; a small cap is plenty.
    mem_limit: ${WEB_MEM_LIMIT:-128m}
    ports:
      - '${WEB_PORT:-8080}:80'
    volumes:
      - site_html:/usr/share/nginx/html:ro
      - site_conf:/etc/nginx/conf.d:ro
    depends_on:
      - publisher
    # The config is generated by the publish step, so it doesn't exist until the
    # first publish. Wait for it rather than starting with no server block (which
    # nginx accepts, then listens on nothing — a confusing "connection refused").
    # NOTE: nginx reads its config once at start, so a publish that changes the
    # legacy redirects needs `docker compose restart web`. Content changes don't.
    command: >
      sh -c "while [ ! -f /etc/nginx/conf.d/default.conf ]; do
               echo 'waiting for the first publish to generate nginx.conf...'; sleep 5;
             done;
             exec nginx -g 'daemon off;'"

volumes:
  db:
  media:
  site_html:
  site_conf:
  publisher_state:
