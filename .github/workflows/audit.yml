# Weekly dependency audit (S6.2). Goes red while production dependencies have
# HIGH/CRITICAL advisories, so a cleared advisory shows up as a green run.
# Known on 2026-11-20: happy-dom (2 high), blocked on Lexical allowing v21.
name: audit

on:
  schedule:
    - cron: '17 5 * * 1' # Mondays 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: pnpm audit (prod, high+)
        run: |
          set -o pipefail
          { echo '## pnpm audit --prod (high and above)'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          status=0
          pnpm audit --prod --audit-level high 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $status
