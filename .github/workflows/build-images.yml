# Build and push the deployment images on a native amd64 runner.
#
# CI equivalent of `pnpm release:app`. GitHub's ubuntu-latest is native
# linux/amd64, so the Next build runs at full speed — no QEMU emulation like a
# cross-build from an Apple Silicon laptop.
#
# Builds three images in parallel:
#   - msb-homepage : the Payload + Next.js app (Dockerfile, `runner` stage)
#   - msb-publisher: the static-snapshot publisher worker (Dockerfile.publisher)
#   - msb-backup   : the nightly restic backup sidecar (Dockerfile.backup)
#
# Auth: the built-in GITHUB_TOKEN pushes to ghcr.io for packages owned by this
# repo's owner (no PAT needed) — hence `permissions: packages: write` below.
name: build-images

on:
  # Limited to this branch on purpose.
  push:
    branches: [main]
  # Allow a manual run from the Actions tab as well.
  workflow_dispatch:

# A newer push supersedes an in-flight build for the same ref.
concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            image: msb-homepage
            dockerfile: Dockerfile
            target: runner
          - name: publisher
            image: msb-publisher
            dockerfile: Dockerfile.publisher
            target: runner
          - name: backup
            image: msb-backup
            dockerfile: Dockerfile.backup
            target: ''
    name: build (${{ matrix.name }})
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Moving `latest` tag + an immutable short-sha tag, matching release-app.sh.
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Per-image cache scope so the two builds don't clobber each other.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
