# Local authoring stack: Payload (CMS) + publisher (builds & pushes the site).
#
# The public site is NOT served here — it is pushed to the registry as an image
# and served elsewhere (see docker-compose.demo.yml). This stack is where the
# content lives and where builds happen.
#
#   cp .env.local.example .env      # fill in PAYLOAD_SECRET, PUBLISH_TOKEN, GHCR_*
#   docker compose -f docker-compose.local.yml up -d --build
#   open http://localhost:3000/admin
#
# Updating: `docker compose ... pull && up -d`. The db and media volumes are
# preserved; `payload migrate` runs on start, so schema changes apply themselves.

services:
  payload:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: msb-payload:local
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      TZ: Europe/Berlin
      DATABASE_URI: file:/app/data/msb.db
      MEDIA_DIR: /app/public/media
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?set PAYLOAD_SECRET in .env}
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-http://localhost:3000}
      # Where the admin's "Jetzt veröffentlichen" button sends its request.
      # Internal network only — the publisher is never exposed to the host.
      PUBLISHER_URL: http://publisher:8080
      PUBLISH_TOKEN: ${PUBLISH_TOKEN:?set PUBLISH_TOKEN in .env}
      INIT_ADMIN_EMAIL: ${INIT_ADMIN_EMAIL:-}
      INIT_ADMIN_PASSWORD: ${INIT_ADMIN_PASSWORD:-}
    volumes:
      - db:/app/data
      - media:/app/public/media

  publisher:
    build:
      context: .
      dockerfile: Dockerfile.publisher
    image: msb-publisher:local
    restart: unless-stopped
    # No `ports:` — only the payload container may reach it.
    environment:
      NODE_ENV: production
      TZ: Europe/Berlin
      PUBLISH_TOKEN: ${PUBLISH_TOKEN:?set PUBLISH_TOKEN in .env}
      # Read-only copies of the CMS state. The DB is copied to /tmp before each
      # build, so a save mid-build can't tear the snapshot.
      SOURCE_DATABASE_FILE: /data/msb.db
      MEDIA_DIR: /app/public/media
      # Compiled into the bundle — must be the PUBLIC origin of the static site,
      # not this stack's address.
      NEXT_PUBLIC_SERVER_URL: ${PUBLIC_SITE_URL:?set PUBLIC_SITE_URL in .env}
      STATIC_IMAGE: ${STATIC_IMAGE:-ghcr.io/agiledivider/msb-demo}
      TAG: ${TAG:-latest}
      PLATFORM: ${PLATFORM:-linux/amd64}
      PUBLISH_NIGHTLY_HOUR: ${PUBLISH_NIGHTLY_HOUR:-3}
      PUBLISH_DEBOUNCE_MS: ${PUBLISH_DEBOUNCE_MS:-300000}
      GIT_SHA: ${GIT_SHA:-nogit}
    volumes:
      - db:/data:ro
      - media:/app/public/media:ro
      # Registry credentials for `crane push` — it reads the same config.json
      # docker login writes. Run `docker login ghcr.io` on the host first.
      - ${DOCKER_CONFIG_DIR:-${HOME}/.docker}:/root/.docker:ro
    depends_on:
      - payload

volumes:
  db:
  media:
