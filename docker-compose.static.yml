# Static site deployment behind an existing nginx-proxy + acme-companion.
# Serves the published snapshot — no Node, no database, no Payload.
#
#   1) publish + push the image from your machine:
#        NEXT_PUBLIC_SERVER_URL=https://makerspacebonn.de pnpm release:static
#   2) on the server (once):
#        docker login ghcr.io
#   3) deploy / update:
#        docker compose -f docker-compose.static.yml pull
#        docker compose -f docker-compose.static.yml up -d
#
# There is no state here: every content change is a new image. Requires a running
# nginx-proxy stack; set the `proxy` network below to that stack's network.

services:
  msb-static:
    image: ${STATIC_IMAGE:-ghcr.io/agiledivider/msb-static}:${TAG:-latest}
    restart: unless-stopped
    # No `ports:` — nginx-proxy reaches the container over the shared network.
    expose:
      - '80'
    environment:
      - VIRTUAL_HOST=${VIRTUAL_HOST:?set VIRTUAL_HOST in .env}
      - VIRTUAL_PORT=80
      - LETSENCRYPT_HOST=${VIRTUAL_HOST}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL:-office@makerspacebonn.de}
    networks:
      - proxy

networks:
  # The external network your nginx-proxy + acme-companion stack runs on.
  # Rename to match it (e.g. nginx-proxy / webproxy) if it isn't `proxy`.
  proxy:
    external: true
